plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.0'
}

group = 'BytecodeVM'
version = '2.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.ow2.asm:asm:9.7'
    implementation 'org.ow2.asm:asm-commons:9.7'
    implementation 'org.ow2.asm:asm-tree:9.7'
    implementation 'org.ow2.asm:asm-util:9.7'

    compileOnly("org.projectlombok:lombok:1.18.46")
    annotationProcessor("org.projectlombok:lombok:1.18.46")

    implementation 'org.yaml:snakeyaml:2.6'

    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'ch.qos.logback:logback-classic:1.5.18'
}

tasks.register('verifySdkIntegration', JavaExec) {
    group = 'verification'
    description = 'Verifies SDK annotation parsing, overrides, and output cleanup.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'SdkAnnotationIntegrationTest'
}

check.dependsOn verifySdkIntegration

jar {
    manifest {
        attributes(
                'Main-Class': 'nhcm.bytecodevm.BytecodeVM'
        )
    }
}

shadowJar {
    archiveClassifier.set('')
}
